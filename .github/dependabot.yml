version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci(actions)

  - package-ecosystem: pip
    directory: /scrapers
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    labels:
      - python
      - dependencies
    commit-message:
      prefix: chore(py-deps)
