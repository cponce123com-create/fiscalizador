<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Fiscalizador · San Ramón</title>
  <desc id="desc">Portada tecnológica en azul oscuro y verde: compras públicas, fuentes documentadas e identidades conectadas. La composición es ilustrativa y no representa cifras reales.</desc>
