    <linearGradient id="accent"><stop stop-color="#34d399"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ba8b7" stroke-opacity=".07"/></pattern>
  </defs>
